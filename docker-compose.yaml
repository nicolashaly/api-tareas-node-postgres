services:
  app: 
    build: .
    container_name: todo-app
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/todoapp
      - JWT_SECRET=${JWT_SECRET:?define JWT_SECRET en .env}
      - NODE_ENV=development
      - PORT=5001
    ports:
      - "5001:5001"
    depends_on:
      - db
    volumes:
      - .:/app
  
  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: todoapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: